name: Publish Post

on:
  push:
    branches: [main]
    paths:
      - "src/content/articles/**"
      - "src/content/posts/**"
      - "src/content/projects/**"
      - "src/content/weekly/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - name: Fetch posts database
        run: |
          git show posts_db:posts.yaml > posts.yaml 2>/dev/null || touch posts.yaml

      - name: Prepare posts
        run: npx tsx scripts/prepare-post.ts
        env:
          FILES: ${{ join(github.event.head_commit.modified, ' ') }} ${{ join(github.event.head_commit.added, ' ') }}

      - name: Publish
        run: npx tsx scripts/publish.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save posts database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git checkout posts_db
          cp "${{ github.workspace }}/posts.yaml" posts.yaml
          git add posts.yaml
          git diff --cached --quiet || git commit -m "Update posts database [skip ci]"
          git push origin posts_db
          git checkout main
          git stash pop || true
